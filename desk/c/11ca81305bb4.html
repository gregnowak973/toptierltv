const KEYNAME="tt-desk-pass";
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// Re-lock. The passphrase is kept in sessionStorage so the tab nav between desk
// pages does not re-prompt — but that also means "restore tabs" silently
// re-opens the desk, potentially in front of the wrong person, with no way back
// to the lock screen short of clearing site data. This button is that way back:
// it drops the stored key and reloads to a locked page.
function addLock(){
  if(document.getElementById("tt-lock"))return;
  var s=document.createElement("style");
  s.textContent="#tt-lock{position:fixed;right:14px;bottom:14px;z-index:2147483647;"+
    "font:600 12px/1 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;"+
    "background:#182028;color:#fff;border:1px solid #45525E;border-radius:6px;"+
    "padding:9px 14px;cursor:pointer;opacity:.82}"+
    "#tt-lock:hover{opacity:1;background:#2B3540}"+
    "@media print{#tt-lock{display:none!important}}";
  document.head.appendChild(s);
  var b=document.createElement("button");
  b.id="tt-lock";b.type="button";b.textContent="Lock";
  b.setAttribute("aria-label","Lock this page and forget the passphrase for this session");
  b.addEventListener("click",function(){
    try{sessionStorage.removeItem(KEYNAME)}catch(_){}
    location.reload();
  });
  document.body.appendChild(b);
}
async function unlock(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  try{sessionStorage.setItem(KEYNAME,pass)}catch(_){}
  document.open();document.write(new TextDecoder().decode(pt));document.close();
  addLock();
}
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();
  const e=document.getElementById("e");e.textContent="";
  try{await unlock(document.getElementById("p").value)}catch(_){e.textContent="Wrong passphrase."}});
(async()=>{try{const s=sessionStorage.getItem(KEYNAME);if(s)await unlock(s)}catch(_){}})();
</script>
